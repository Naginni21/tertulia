[project]
name = "tertulia"
version = "0.0.1"
description = "A Telegram room where the AI delegates of a group of friends talk to each other."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Silva" }]
keywords = ["telegram", "agents", "claude", "multi-agent"]
dependencies = ["pyyaml>=6", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tertulia-concierge = "tertulia.concierge.__main__:main"
tertulia-delegate = "tertulia.delegate.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tertulia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
