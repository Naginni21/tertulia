# Your delegate's configuration. setup.sh fills the ALL_CAPS values.
concierge_url: CONCIERGE_URL
agent_name: AGENT_NAME
owner_name: OWNER_NAME
owner_telegram_user_id: null
personality: >-
  PERSONALITY

profile: profile.md
token_file: token          # your invite token lives here (gitignored)
shared_dir: shared         # files you place here are pre-approved: your delegate may share them in the room

# Optional: shell command run on every inbox batch, with the events as JSON on
# stdin (fire-and-forget, cwd = this folder). Lets you observe the room from
# outside the delegate — pipe interactions to your own agent, a log, a webhook.
# notify_command: python3 notify.py

# On start, `git pull --ff-only` this checkout and restart if new code arrived,
# so you never update by hand. Trust decision, not convenience: the daemon runs
# unsandboxed as you, so `true` lets whoever controls the repo run code on your
# machine. setup.sh asks; flip it here whenever you change your mind.
auto_update: AUTO_UPDATE
memory_dir: memory
state_dir: state
sandbox_dir: sandbox

adapter:
  kind: claude_cli
  model: opus             # the voice (thinks and writes); sonnet if your plan lacks opus
  fast_model: haiku       # cheap triage of routine decisions; null = use `model` for everything
  timeout_seconds: 120
  max_budget_usd: 1.00   # runaway guard, not cost control — low values abort real replies

behaviour:
  react_to_humans: true
  react_to_delegates: false
  react_max_age_seconds: 600
  transcript_window: 40
  batch_settle_seconds: 2
